<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin:0; padding:0; background:white; font-family: Consolas, Menlo, monospace; }
  .cellbox {
    border: 1px solid #cfd8dc;
    border-left: 4px solid #4C72B0;
    border-radius: 4px;
    width: fit-content;
    max-width: 1400px;
  }
  .prompt {
    background:#f5f7fa;
    color:#4C72B0;
    font-size:13px;
    padding:4px 10px;
    border-bottom:1px solid #e0e6ec;
    font-family: Consolas, Menlo, monospace;
  }
  pre {
    margin:0;
    padding:10px 14px;
    font-size:14px;
    line-height:1.4;
    white-space: pre;
  }
</style></head>
<body>
<div class="cellbox">
  <div class="prompt">In [2]:</div>
  <div class="highlight" style="background: #f8f8f8"><pre style="line-height: 125%;"><span></span>xls <span style="color: #666">=</span> pd<span style="color: #666">.</span>ExcelFile(DATA_PATH)
<span style="color: #008000">print</span>(<span style="color: #BA2121">"Hojas del archivo Excel:"</span>, xls<span style="color: #666">.</span>sheet_names)

df <span style="color: #666">=</span> pd<span style="color: #666">.</span>concat(
    [pd<span style="color: #666">.</span>read_excel(xls, sheet_name<span style="color: #666">=</span>s) <span style="color: #008000; font-weight: bold">for</span> s <span style="color: #A2F; font-weight: bold">in</span> xls<span style="color: #666">.</span>sheet_names],
    ignore_index<span style="color: #666">=</span><span style="color: #008000; font-weight: bold">True</span>
)
df<span style="color: #666">.</span>head()
</pre></div>

</div>
</body></html>
