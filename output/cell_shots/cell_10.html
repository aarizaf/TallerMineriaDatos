<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin:0; padding:0; background:white; font-family: Consolas, Menlo, monospace; }
  .cellbox {
    border: 1px solid #cfd8dc;
    border-left: 4px solid #4C72B0;
    border-radius: 4px;
    width: fit-content;
    max-width: 1400px;
  }
  .prompt {
    background:#f5f7fa;
    color:#4C72B0;

    padding:4px 10px;
    border-bottom:1px solid #e0e6ec;
    font-family: Consolas, Menlo, monospace;
  }

    padding:10px 14px;
    font-size:14px;
    line-height:1.4;
    white-space: pre;
  }
</style></head>
<body>
<div class="cellbox">
  <div class="prompt">In [10]:</div>
  <div class="highlight" style="background: #f8f8f8"><pre style="line-height: 125%;"><span></span>baskets_series <span style="color: #666">=</span> df_clean<span style="color: #666">.</span>groupby(<span style="color: #BA2121">"Invoice"</span>)[<span style="color: #BA2121">"StockCode"</span>]<span style="color: #666">.</span>apply(<span style="color: #008000; font-weight: bold">lambda</span> s: <span style="color: #008000">frozenset</span>(s))

n_canastas <span style="color: #666">=</span> <span style="color: #008000">len</span>(baskets_series)
<span style="color: #008000">print</span>(<span style="color: #BA2121">"Total de canastas:"</span>, n_canastas)
<span style="color: #008000; font-weight: bold">assert</span> n_canastas <span style="color: #666">==</span> <span style="color: #666">36_644</span>
</pre></div>

</div>
</body></html>
