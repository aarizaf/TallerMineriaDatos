<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin:0; padding:0; background:white; font-family: Consolas, Menlo, monospace; }
  .cellbox {
    border: 1px solid #cfd8dc;
    border-left: 4px solid #4C72B0;
    border-radius: 4px;
    width: fit-content;
    max-width: 1400px;
  }
  .prompt {
    background:#f5f7fa;
    color:#4C72B0;
    font-size:13px;
    padding:4px 10px;
    border-bottom:1px solid #e0e6ec;
    font-family: Consolas, Menlo, monospace;
  }
  pre {
    margin:0;
    padding:10px 14px;
    font-size:14px;
    line-height:1.4;
    white-space: pre;
  }
</style></head>
<body>
<div class="cellbox">
  <div class="prompt">In [22]:</div>
  <div class="highlight" style="background: #f8f8f8"><pre style="line-height: 125%;"><span></span>strongest <span style="color: #666">=</span> rules_sorted<span style="color: #666">.</span>iloc[<span style="color: #666">0</span>]
<span style="color: #008000">print</span>(<span style="color: #BA2121">"Antecedente:"</span>, strongest[<span style="color: #BA2121">"antecedent_desc"</span>])
<span style="color: #008000">print</span>(<span style="color: #BA2121">"Consecuente:"</span>, strongest[<span style="color: #BA2121">"consequent_desc"</span>])
<span style="color: #008000">print</span>(<span style="color: #BA2121">"Lift:"</span>, <span style="color: #008000">round</span>(strongest[<span style="color: #BA2121">"lift"</span>], <span style="color: #666">2</span>))
<span style="color: #008000">print</span>(<span style="color: #BA2121">"Confianza:"</span>, <span style="color: #008000">round</span>(strongest[<span style="color: #BA2121">"confidence"</span>], <span style="color: #666">4</span>))
<span style="color: #008000">print</span>(<span style="color: #BA2121">"Soporte:"</span>, <span style="color: #008000">round</span>(strongest[<span style="color: #BA2121">"support"</span>], <span style="color: #666">4</span>))
</pre></div>

</div>
</body></html>
